[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-ai"
version = "0.1.0"
description = "Local-first AI CLI: local inference, dataset tooling, and fine-tuning experiments."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15,<0.28",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
train = [
    # LoRA fine-tuning via Apple's MLX framework: the realistic path on
    # Apple Silicon unified memory (see docs/TRAINING.md for why this was
    # chosen over transformers/peft/trl + bitsandbytes QLoRA).
    "mlx>=0.18,<1.0",
    "mlx-lm>=0.19,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
