[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-ai"
version = "0.1.0"
description = "Local-first AI CLI: local inference, dataset tooling, and fine-tuning experiments."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
train = [
    "datasets>=2.19,<3.0",
    "transformers>=4.42,<5.0",
    "peft>=0.11,<1.0",
    "trl>=0.9,<1.0",
]

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
